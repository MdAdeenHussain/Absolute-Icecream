services:

  web:
    build: .
    container_name: absolute_icecream_web

    ports:
      - "5000:5000"

    env_file:
      - .env

    environment:
      DATABASE_URL: postgresql+psycopg://postgres:postgres@postgres:5432/absolute_icecream

    depends_on:
      - postgres
      - redis

    volumes:
      - .:/app


  postgres:
    image: postgres:17

    container_name: absolute_icecream_postgres

    environment:
      POSTGRES_DB: absolute_icecream
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data


  redis:
    image: redis:7-alpine

    container_name: absolute_icecream_redis

    ports:
      - "6379:6379"


volumes:
  postgres_data:
