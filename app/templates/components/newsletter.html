<section class="newsletter">

    <div class="newsletter__content">

        <span class="eyebrow">
            Stay in the loop
        </span>

        <h2 class="display-small">
            Good things are
            worth knowing about.
        </h2>

        <p>
            New flavours, lab-day stories and the occasional
            reason to open the freezer.
        </p>

    </div>

    <form
        class="newsletter__form"
        method="post"
        action="#"
    >

        <label
            for="newsletter-email"
            class="sr-only"
        >
            Email address
        </label>

        <input
            id="newsletter-email"
            type="email"
            name="email"
            placeholder="Your email address"
            autocomplete="email"
            required
        >

        <button
            type="submit"
            class="button button--primary"
        >
            Subscribe
            <i data-lucide="arrow-up-right"></i>
        </button>

    </form>

</section>
