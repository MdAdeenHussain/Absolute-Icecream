<div
    class="cookie-banner"
    data-cookie-banner
    role="dialog"
    aria-label="Cookie preferences"
    aria-hidden="true"
>

    <div class="cookie-banner__content">

        <span class="eyebrow">
            Your privacy
        </span>

        <p>
            We use essential storage to make the site work.
            Optional analytics will only be enabled according
            to your preferences.
        </p>

    </div>

    <div class="cookie-banner__actions">

        <button
            type="button"
            class="button button--ghost"
            data-cookie-reject
        >
            Essential only
        </button>

        <button
            type="button"
            class="button button--primary"
            data-cookie-accept
        >
            Allow analytics
        </button>

    </div>

</div>
