{% extends "base.html" %}

{% block title %}
Login | Absolute Icecream™
{% endblock %}

{% block content %}

<section class="account-auth">

    <div class="auth-card">

        <span class="eyebrow">
            WELCOME BACK
        </span>

        <h1>
            Sign in
        </h1>

        <p class="auth-intro">
            Access your orders, saved addresses and
            Absolute Icecream™ account.
        </p>

        <form method="POST">

            <div class="form-field">
                <label for="email">
                    Email
                </label>

                <input
                    id="email"
                    type="email"
                    name="email"
                    autocomplete="email"
                    required
                >
            </div>

            <div class="form-field">
                <label for="password">
                    Password
                </label>

                <input
                    id="password"
                    type="password"
                    name="password"
                    autocomplete="current-password"
                    required
                >
            </div>

            <button
                type="submit"
                class="account-submit"
            >
                Sign In
            </button>

        </form>

        <p class="auth-switch">
            Don't have an account?
            <a href="{{ url_for('auth.register') }}">
                Create one
            </a>
        </p>

    </div>

</section>

{% endblock %}
