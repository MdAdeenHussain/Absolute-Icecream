{% extends "base.html" %}

{% block content %}

<div class="admin-shell">

    <aside class="admin-sidebar">

        <div class="admin-brand">

            <strong>
                ABSOLUTE
            </strong>

            <span>
                ADMIN
            </span>

        </div>


        <nav class="admin-nav">

            <a href="{{ url_for('admin.dashboard') }}">
                Dashboard
            </a>

            <a href="{{ url_for('admin.products') }}">
                Products
            </a>

            <a href="{{ url_for('admin.orders') }}">
                Orders
            </a>

            <a href="{{ url_for('admin.customers') }}">
                Customers
            </a>

        </nav>


        <div class="admin-sidebar-bottom">

            <a
                href="{{ url_for('shop.shop') }}"
                target="_blank"
            >
                View Store
            </a>

            <a href="{{ url_for('admin.logout') }}">
                Sign Out
            </a>

        </div>

    </aside>


    <main class="admin-main">

        <header class="admin-topbar">

            <div>
                <span>
                    Absolute Icecream™
                </span>

                <strong>
                    {{ admin.name }}
                </strong>
            </div>

        </header>


        <div class="admin-content">

            {% block admin_content %}
            {% endblock %}

        </div>

    </main>

</div>

{% endblock %}
